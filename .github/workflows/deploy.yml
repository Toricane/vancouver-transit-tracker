name: Build and deploy transit tracker

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 00:15 Vancouver time during daylight saving; 23:15 in winter.
    # A second run ensures the new local service date is built in winter.
    - cron: '15 7,8 * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/configure-pages@v5
      - run: python -m pip install -r requirements.txt
      - name: Choose seven-day feed cache
        id: feed
        run: echo "bucket=$(($(date -u +%s) / 604800))" >> "$GITHUB_OUTPUT"
      - name: Restore weekly GTFS download
        id: gtfs-cache
        uses: actions/cache@v4
        with:
          path: .cache/google_transit.zip
          key: translink-gtfs-v1-${{ steps.feed.outputs.bucket }}
      - name: Download current TransLink feed
        if: steps.gtfs-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache
          curl --fail --location --retry 3 --max-time 180 \
            https://gtfs-static.translink.ca/gtfs/google_transit.zip \
            --output .cache/google_transit.zip
      - name: Build schedules from cached feed
        run: python build_site.py --gtfs-zip .cache/google_transit.zip
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
